# Gradle JVM 参数：强制使用 IPv4 避免 Windows 下代理/TUN 模式的 getsockopt 超时
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# HTTP/HTTPS 代理配置（7897 端口）
# ⚠️ 2026-10-21：本机走该代理时 Gradle 报 "Remote host terminated the handshake"（TLS 握手被拒），已禁用。
#    直连与国内镜像实测均可用（腾讯云 0.4s / 阿里云 0.8s / 直连 2.1s），故改走 ~/.gradle/init.d/ 里的镜像配置。
#    若你本机代理恢复正常且需要它，把下面四行的 # 去掉即可。
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
#systemProp.http.nonProxyHosts=localhost|127.*|[::1]
